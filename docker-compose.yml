version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  redis:
    image: redis:alpine
    container_name: hydro_redis
    ports:
      - "6379:6379"
    restart: always

  celery:
    build: .
    container_name: hydro_celery
    # O comando abaixo é o que transforma o Django comum em um Trabalhador de Background
    command: celery -A core worker -l INFO
    volumes:
      - .:/app  # Ajuste isso para o mesmo volume que você usa no serviço 'web'
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data: